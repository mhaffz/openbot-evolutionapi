services:
  evolution-openbot-bridge:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      WEBHOOK_SHARED_SECRET: "${WEBHOOK_SHARED_SECRET:?set in Coolify}"
      EVOLUTION_INSTANCE_NAME: "Paut"
      QUEUE_DIR: "/data/queue"
      RECEIPTS_DIR: "/data/receipts"
      QUEUE_RETENTION_HOURS: "24"
      MAX_QUEUE_ITEMS: "2000"
    expose:
      - "8080"
    volumes:
      - evolution_queue:/data

volumes:
  evolution_queue:
